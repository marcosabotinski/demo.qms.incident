# Production-shaped compose for the AWS VM.
# Only the nginx frontend is published (host :80). Postgres and the API stay
# on the internal compose network so they are not reachable from the internet.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d qms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://qms:qms@db:5432/qms
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
