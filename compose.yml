# Optional / legacy. Prefer `npm install && npm run seed && npm run dev`.
services:
  api:
    build:
      context: ./api
    environment:
      SQLITE_PATH: /data/qms.sqlite
      PORT: "4000"
    volumes:
      - sqlite:/data
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqlite:
